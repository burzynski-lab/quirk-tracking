<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .box   { rx: 8; stroke-width: 1.5; }
    .t     { font-size: 14px; fill: #222; }
    .tb    { font-size: 15px; font-weight: bold; fill: #222; }
    .ts    { font-size: 12px; fill: #555; }
    .tw    { font-size: 12px; fill: #8a5a00; }
    .flow  { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  </style>

  <text x="640" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Quirk MaskFormer (hepattn) — as configured in quirks-tracking.yaml</text>

  <!-- ============ INPUT ============ -->
  <rect class="box" x="30" y="70" width="200" height="120" fill="#eef4fb" stroke="#3b76b0"/>
  <text class="tb" x="130" y="93" text-anchor="middle">Spacepoints</text>
  <text class="t"  x="130" y="115" text-anchor="middle">~2&#8211;3k hits / event</text>
  <text class="ts" x="130" y="135" text-anchor="middle">17 features per hit:</text>
  <text class="ts" x="130" y="151" text-anchor="middle">x y z r s &#951; &#966; u v</text>
  <text class="ts" x="130" y="167" text-anchor="middle">+ cluster shape (charge_frac,</text>
  <text class="ts" x="130" y="182" text-anchor="middle">l&#951; l&#966; lx ly lz g&#951; g&#966;)</text>

  <!-- ============ INPUT NET ============ -->
  <rect class="box" x="280" y="70" width="210" height="120" fill="#eef4fb" stroke="#3b76b0"/>
  <text class="tb" x="385" y="93" text-anchor="middle">InputNet</text>
  <text class="t"  x="385" y="115" text-anchor="middle">Dense 17 &#8594; 128 &#8594; 256</text>
  <text class="ts" x="385" y="133" text-anchor="middle">SwiGLU activation</text>
  <text class="t"  x="385" y="155" text-anchor="middle">+ PositionEncoder(r, &#951;, &#966;)</text>
  <text class="ts" x="385" y="173" text-anchor="middle">hit tokens: N &#215; 256</text>

  <!-- ============ ENCODER ============ -->
  <rect class="box" x="540" y="60" width="250" height="140" fill="#e8f5ec" stroke="#2f8f4e"/>
  <text class="tb" x="665" y="84" text-anchor="middle">Encoder &#215; 8 layers</text>
  <text class="t"  x="665" y="106" text-anchor="middle">self-attention over hits</text>
  <text class="ts" x="665" y="124" text-anchor="middle">flash attn, no bias, hybrid norm</text>
  <text class="ts" x="665" y="140" text-anchor="middle">full attention over all hits</text>
  <text class="ts" x="665" y="156" text-anchor="middle">(no window &#8212; every hit sees both arms)</text>
  <text class="ts" x="665" y="176" text-anchor="middle">SwiGLU FFN &#183; dim 256</text>

  <!-- ============ QUERIES ============ -->
  <rect class="box" x="540" y="280" width="250" height="70" fill="#fdf1e2" stroke="#d08a2e"/>
  <text class="tb" x="665" y="305" text-anchor="middle">8 learned object queries</text>
  <text class="ts" x="665" y="325" text-anchor="middle">fixed (dynamic_queries: false) &#183; 8 &#215; 256</text>

  <!-- ============ DECODER ============ -->
  <rect class="box" x="860" y="60" width="290" height="290" fill="#f6eef9" stroke="#8e5aa8"/>
  <text class="tb" x="1005" y="84" text-anchor="middle">MaskFormer decoder &#215; 3 layers</text>
  <text class="t"  x="1005" y="110" text-anchor="middle">1. masked cross-attention</text>
  <text class="ts" x="1005" y="127" text-anchor="middle">query &#8594; hits, attention restricted to</text>
  <text class="ts" x="1005" y="142" text-anchor="middle">each query's current predicted mask</text>
  <text class="t"  x="1005" y="166" text-anchor="middle">2. query self-attention</text>
  <text class="ts" x="1005" y="183" text-anchor="middle">the 8 queries negotiate (pair correlations)</text>
  <text class="t"  x="1005" y="207" text-anchor="middle">3. SwiGLU FFN</text>
  <text class="ts" x="1005" y="231" text-anchor="middle">mask re-predicted after every layer;</text>
  <text class="ts" x="1005" y="246" text-anchor="middle">intermediate layers also supervised</text>
  <text class="ts" x="1005" y="261" text-anchor="middle">(deep supervision)</text>
  <text class="ts" x="1005" y="285" text-anchor="middle">uni-directional CA &#183; dim 256</text>

  <!-- ============ HEADS ============ -->
  <rect class="box" x="30" y="430" width="1220" height="180" fill="#fbfbfb" stroke="#999"/>
  <text class="tb" x="640" y="455" text-anchor="middle">Task heads (per query, from final + intermediate decoder layers)</text>

  <rect class="box" x="55"  y="475" width="215" height="115" fill="#fdecec" stroke="#c0504d"/>
  <text class="tb" x="162" y="498" text-anchor="middle">track_hit_valid</text>
  <text class="t"  x="162" y="518" text-anchor="middle">hit mask: &#963;(query &#183; hit)</text>
  <text class="ts" x="162" y="536" text-anchor="middle">which hits belong to this track</text>
  <text class="tw" x="162" y="558" text-anchor="middle">focal &#215;100 &#183; dice &#215;2</text>
  <text class="tw" x="162" y="574" text-anchor="middle">(also drives matching)</text>

  <rect class="box" x="295" y="475" width="215" height="115" fill="#fdecec" stroke="#c0504d"/>
  <text class="tb" x="402" y="498" text-anchor="middle">track_valid</text>
  <text class="t"  x="402" y="518" text-anchor="middle">objectness: real vs null</text>
  <text class="ts" x="402" y="536" text-anchor="middle">sigmoid classifier</text>
  <text class="tw" x="402" y="558" text-anchor="middle">BCE &#215;0.1</text>
  <text class="tw" x="402" y="574" text-anchor="middle">(matching cost &#215;0.1)</text>

  <rect class="box" x="535" y="475" width="215" height="115" fill="#fdecec" stroke="#c0504d"/>
  <text class="tb" x="642" y="498" text-anchor="middle">track_iou</text>
  <text class="t"  x="642" y="518" text-anchor="middle">predicts own mask IoU</text>
  <text class="ts" x="642" y="536" text-anchor="middle">per-track quality / confidence</text>
  <text class="tw" x="642" y="558" text-anchor="middle">MSE &#215;1</text>

  <rect class="box" x="775" y="475" width="215" height="115" fill="#fdecec" stroke="#c0504d"/>
  <text class="tb" x="882" y="498" text-anchor="middle">track_fom</text>
  <text class="t"  x="882" y="518" text-anchor="middle">regress log&#8321;&#8320;(&#923;&#178;/m)</text>
  <text class="ts" x="882" y="536" text-anchor="middle">the identifiable trajectory combo</text>
  <text class="tw" x="882" y="558" text-anchor="middle">smooth-L1 &#215;1</text>
  <text class="tw" x="882" y="574" text-anchor="middle">(no matching cost)</text>

  <rect class="box" x="1015" y="475" width="215" height="115" fill="#fdecec" stroke="#c0504d"/>
  <text class="tb" x="1122" y="498" text-anchor="middle">track_plane</text>
  <text class="t"  x="1122" y="518" text-anchor="middle">regress pair-plane normal</text>
  <text class="ts" x="1122" y="536" text-anchor="middle">(nx, ny, nz) &#8212; coplanarity</text>
  <text class="tw" x="1122" y="558" text-anchor="middle">smooth-L1 &#215;1</text>
  <text class="tw" x="1122" y="574" text-anchor="middle">(no matching cost)</text>

  <!-- ============ MATCHER ============ -->
  <rect class="box" x="380" y="640" width="520" height="60" fill="#fffbe6" stroke="#b5a200"/>
  <text class="tb" x="640" y="663" text-anchor="middle">Hungarian matcher (scipy)</text>
  <text class="ts" x="640" y="683" text-anchor="middle">assigns queries &#8596; truth quirks by mask + objectness cost; losses computed on the matched pairing</text>

  <!-- ============ ARROWS ============ -->
  <line class="flow" x1="230" y1="130" x2="278" y2="130"/>
  <line class="flow" x1="490" y1="130" x2="538" y2="130"/>
  <line class="flow" x1="790" y1="130" x2="858" y2="130"/>
  <text class="ts" x="824" y="120" text-anchor="middle">K,V</text>
  <path class="flow" d="M790,315 C830,315 830,240 858,225"/>
  <text class="ts" x="835" y="300" text-anchor="middle">Q</text>
  <line class="flow" x1="1005" y1="350" x2="1005" y2="428"/>
  <text class="ts" x="1060" y="395" text-anchor="middle">updated queries (8 &#215; 256)</text>
  <path class="flow" d="M665,200 C665,240 500,380 320,430"/>
  <text class="ts" x="475" y="352" text-anchor="middle">hit embeddings (for the mask dot product)</text>
  <line class="flow" x1="640" y1="610" x2="640" y2="638"/>
</svg>
